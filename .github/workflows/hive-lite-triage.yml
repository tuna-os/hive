# hive-lite: CLI-less, report-only triage of one issue on free-tier inference
# (RFC hivecommons/hive#18464, Family C). Runs on a free GitHub-hosted runner:
# no tmux, no agent CLI, no privileged container, no persistent volume.
#
# Scope per the maintainer decision on #18464 (phase 1): default-off (manual
# dispatch only), report-only, shadow. The advisory goes to the job's step
# summary and nowhere else. The job token is read-only and hive-lite makes
# GET requests only: no comments, labels, branches, commits or pull
# requests. Any GitHub write belongs to the Hive App.
#
# Secrets:
#   HIVE_LITE_GATEWAYS  YAML gateway list (see src/cmd/hive-lite/main.go);
#                       reference keys by api_key_env, never inline them.
#                       Mark free tiers that train on inputs with
#                       trains_on_inputs: true; they are skipped for a
#                       private repository.
#   CLOUDFLARE_API_TOKEN  (or whatever api_key_env names) — Workers AI read.
#   HIVE_LITE_STATE     optional d1:<account-id>/<database-id>. When set, the
#                       session and router ledger persist in Cloudflare D1
#                       (HIVE_STATE_CF_TOKEN with D1 write), so a run that
#                       exits for capacity resumes. Unset keeps state in
#                       memory for the run. A GitHub-branch store is not
#                       offered: it would be a GitHub write.
name: hive-lite triage

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number in this repository
        required: true
        type: number

permissions:
  contents: read
  issues: read

concurrency:
  group: hive-lite-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: src/go.mod
      - name: Build hive-lite
        working-directory: src
        run: go build -o "$RUNNER_TEMP/hive-lite" ./cmd/hive-lite
      - name: Triage
        env:
          GH_TOKEN: ${{ github.token }}
          HIVE_LITE_GATEWAYS: ${{ secrets.HIVE_LITE_GATEWAYS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HIVE_STATE_CF_TOKEN: ${{ secrets.HIVE_STATE_CF_TOKEN }}
          HIVE_LITE_STATE: ${{ secrets.HIVE_LITE_STATE }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          if [ -z "${HIVE_LITE_GATEWAYS:-}" ]; then
            echo "::error::HIVE_LITE_GATEWAYS secret is not set"; exit 1
          fi
          printf '%s\n' "$HIVE_LITE_GATEWAYS" > "$RUNNER_TEMP/gateways.yaml"
          args=(-repo "$GITHUB_REPOSITORY" -issue "$ISSUE" -gateways "$RUNNER_TEMP/gateways.yaml" -checkout "$GITHUB_WORKSPACE" -v)
          case "${HIVE_LITE_STATE:-}" in
            "") ;;
            d1:*) args+=(-state "$HIVE_LITE_STATE") ;;
            *) echo "::error::HIVE_LITE_STATE must be d1:<account-id>/<database-id>"; exit 1 ;;
          esac
          set +e
          "$RUNNER_TEMP/hive-lite" "${args[@]}" | tee "$RUNNER_TEMP/result.txt"
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo '```json'; sed -n '1,/^}/p' "$RUNNER_TEMP/result.txt"; echo '```'
            sed '1,/^}/d' "$RUNNER_TEMP/result.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = 75 ]; then
            echo "::warning::No free-tier capacity now (all gateways rate limited or capped); re-run later to resume"; exit 0
          fi
          exit "$rc"
