# FORK-ONLY (tuna-os/hive): builds upstream v6 into ghcr.io/tuna-os/hive.
# Upstream publishes no owned v6 tag (see hivecommons/hive#9382), so the
# fork builds its own for the AWS Talos fleet. Any generic fix belongs
# upstream — do not sync this file upstream.
name: Build v6 fork image

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream ref to build (branch, tag, or SHA)"
        default: "v6"
        required: true
      version:
        description: "VERSION stamp baked into the binary"
        default: "v6.0.0-fork"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out upstream ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hivecommons/hive
          ref: ${{ inputs.upstream_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve SHA
        id: sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "full=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_HASH=${{ steps.sha.outputs.full }}
            GIT_BRANCH=v6
            VERSION=${{ inputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ steps.sha.outputs.full }}
          # Mirror upstream's stale-binary defense: force the binary-bearing
          # stages to re-execute so the shipped /hive matches HEAD.
          no-cache-filters: builder,runtime
          tags: |
            ghcr.io/tuna-os/hive:v6-${{ steps.sha.outputs.short }}
            ghcr.io/tuna-os/hive:v6-latest

      - name: Print image digest
        run: echo "digest=${{ steps.build.outputs.digest }}"
